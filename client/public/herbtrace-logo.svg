<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d26" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Gold Accent Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ayurvedic Golden Rim -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#softGlow)" />

  <!-- Inner subtle circular track (Blockchain ring) -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Blockchain Hash / Connection Nodes on the perimeter -->
  <circle cx="60" cy="12" r="3" fill="#f59e0b" />
  <circle cx="102" cy="40" r="2.5" fill="#4ade80" />
  <circle cx="95" cy="88" r="2.5" fill="#f59e0b" />
  <circle cx="25" cy="88" r="2.5" fill="#4ade80" />
  <circle cx="18" cy="40" r="2.5" fill="#f59e0b" />

  <!-- Connecting fine lines (circuit / blockchain mesh) -->
  <path d="M 60 12 L 102 40 M 102 40 L 95 88 M 95 88 L 60 106 M 60 106 L 25 88 M 25 88 L 18 40 M 18 40 L 60 12" fill="none" stroke="#86efac" stroke-width="0.75" opacity="0.25" />

  <!-- Central Stem / Botanical Sprout Spine -->
  <path d="M 60 96 C 60 75 58 48 60 26" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" />

  <!-- Left Main Leaf (Organic Ayurvedic Foliage) -->
  <path d="M 60 68 C 42 66 32 50 36 34 C 48 34 58 48 60 62 Z" fill="url(#leafGrad1)" filter="url(#softGlow)" />
  <!-- Left Leaf Vein -->
  <path d="M 40 40 C 48 48 56 56 60 62" fill="none" stroke="#bbf7d0" stroke-width="1.2" opacity="0.8" />

  <!-- Right Main Leaf -->
  <path d="M 60 54 C 78 52 88 38 84 22 C 72 22 62 36 60 48 Z" fill="url(#leafGrad2)" filter="url(#softGlow)" />
  <!-- Right Leaf Vein -->
  <path d="M 80 28 C 72 36 64 44 60 48" fill="none" stroke="#bbf7d0" stroke-width="1.2" opacity="0.8" />

  <!-- Bottom Accent Leaf / Herb Seedling Base -->
  <path d="M 60 82 C 48 80 44 72 48 66 C 54 66 58 72 60 78 Z" fill="#4ade80" opacity="0.85" />
  <path d="M 60 76 C 72 74 76 66 72 60 C 66 60 62 66 60 72 Z" fill="#86efac" opacity="0.85" />

  <!-- Central Verification Node (Blockchain Pulse Point) -->
  <circle cx="60" cy="26" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="60" cy="62" r="3" fill="#ffffff" />
  <circle cx="60" cy="96" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
</svg>
